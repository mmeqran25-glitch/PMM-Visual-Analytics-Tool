name: PMM App Smoke Test

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile app.py master_utils.py tree_utils.py visual_utils.py share_utils.py

      - name: Run version-agnostic smoke test
        run: python tests/smoke_test.py
